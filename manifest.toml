#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "cleanuparr"
name = "Cleanuparr"
description.en = "Advanced download manager for the Servarr ecosystem"
description.fr = "Gestionnaire avancé de téléchargements pour l'écosystème Servarr"

version = "2.10.12~ynh1"

maintainers = ["Jean-Benoit"]

[upstream]
license = "GPL-3.0-or-later"
website = "https://cleanuparr.github.io/Cleanuparr/"
admindoc = "https://cleanuparr.github.io/Cleanuparr/docs/installation/"
userdoc = "https://cleanuparr.github.io/Cleanuparr/docs/"
code = "https://github.com/Cleanuparr/Cleanuparr"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "350M"
ram.build = "512M"
ram.runtime = "512M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/cleanuparr"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources.main]
    in_subdir = true
    format = "zip"
    amd64.url = "https://github.com/Cleanuparr/Cleanuparr/releases/download/v2.10.12/Cleanuparr-2.10.12-linux-amd64.zip"
    amd64.sha256 = "8505dc25f1cf05fb08055531b8e25b01a8bc95b908b58ab1f2712cfaa8c11a53"
    arm64.url = "https://github.com/Cleanuparr/Cleanuparr/releases/download/v2.10.12/Cleanuparr-2.10.12-linux-arm64.zip"
    arm64.sha256 = "568c8bfa704f6fe14a24cd5113e8dfa25a1628555571337bd9bf1619bc05934c"

    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/Cleanuparr/Cleanuparr"
    autoupdate.asset.amd64 = "Cleanuparr-.*-linux-amd64\\.zip"
    autoupdate.asset.arm64 = "Cleanuparr-.*-linux-arm64\\.zip"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["logs", "venv"]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 11011

    [resources.apt]
    packages = "ca-certificates, libicu-dev, libssl-dev, python3, python3-venv"
